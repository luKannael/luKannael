<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="180"
     viewBox="0 0 1200 180"
     role="img"
     aria-labelledby="banner-title banner-description">
  <title id="banner-title">Lucas Anael</title>
  <desc id="banner-description">Banner escuro com degradê estático e a logo Lucas Anael centralizada.</desc>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #banner-logo {
      animation: fadeIn 1.2s ease-in-out both;
    }
  </style>

  <defs>
    <linearGradient id="background-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#171819" />
      <stop offset="100%" stop-color="#343638" />
    </linearGradient>
  </defs>

  <g id="banner-content">
    <!-- Fundo escuro para manter o banner legível mesmo quando o SVG é exibido isoladamente. -->
    <rect width="1200" height="180" fill="url(#background-gradient)" />

    <!-- Conteúdo vetorial de logo.svg, incorporado diretamente e escalado para ~80px de largura. -->
    <g id="banner-logo"
       transform="translate(560 60.7) scale(0.09195)"
       fill="#F4F3EF">
      <path d="M221.036 284.009 H360.000 V810.977 H515.048 C562.762 811.147 574.484 782.439 616.917 726.631 C642.625 686.506 675.544 672.918 721.179 668.029 H802.561 L716.863 508.761 L560.367 751.924 C540.771 773.309 529.679 781.148 504.072 781.011 H412.478 L720.767 287.181 L1088.652 918.997 H935.480 L819.491 704.569 L631.325 919.991 H327.583 C267.785 919.659 220.346 874.674 220.956 812.396 Z"
            transform="translate(-220 -283)" />
      <animate attributeName="opacity"
               from="0"
               to="1"
               dur="1.2s"
               begin="0s"
               fill="freeze" />
    </g>
  </g>
</svg>
